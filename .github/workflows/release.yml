# ABOUTME: Cuts a dravr-browser release through dravr-build-config's release-crate.yml
# ABOUTME: Bump, tag, crates.io publish, then the GitHub release, all in the shared workflow

name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  # One crate: bumped, committed, pushed with its tag atomically, published to
  # crates.io, and only then given its GitHub release.
  release:
    name: Bump, tag, publish and release
    uses: dravr-ai/dravr-build-config/.github/workflows/release-crate.yml@main
    with:
      bump: ${{ inputs.bump }}
      publish: dravr-browser
    secrets:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
