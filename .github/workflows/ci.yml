name: CI

on:
  workflow_dispatch:
  push:
    branches: ["main", "debug/**", "feature/**", "features/**", "fix/**", "claude/**", "copilot/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_WARNINGS: deny

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets
      # The session data model, without the browser: what a consumer that only
      # carries a session between services builds.
      - run: cargo check --no-default-features --all-targets
      - run: cargo test --no-default-features
      - name: Without `chrome` the crate links no chromiumoxide
        run: |
          if ! tree="$(cargo tree --no-default-features -e normal --prefix none)"; then exit 1; fi
          grep -q '^dravr-browser v' <<<"$tree" || { echo "scan resolved nothing"; exit 1; }
          if grep -q '^chromiumoxide ' <<<"$tree"; then echo "chromiumoxide leaked into the build without chrome"; exit 1; fi
          echo "no chromiumoxide without chrome"

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --quiet
      - run: cargo clippy --no-default-features --all-targets --quiet

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - name: Install Chrome
        # tests/tick_checkbox.rs drives a real headless Chrome via chromiumoxide.
        uses: browser-actions/setup-chrome@latest
      - run: cargo test

  validate:
    name: Architectural Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install ripgrep
        run: sudo apt-get install -y ripgrep
      - name: Run architectural validation
        run: .build/validation/validate.sh

  publish-dry-run:
    name: Publish Dry Run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo publish --dry-run

  # The one check a branch rule or a reader needs: green only when every job
  # above succeeded. `!cancelled()` runs it after a failure too, and comparing
  # each result to "success" rather than testing for "failure" counts a skipped
  # or cancelled job as red, which `needs` alone would let through.
  ci-ok:
    name: CI OK
    if: ${{ !cancelled() }}
    needs: [check, clippy, fmt, test, validate, publish-dry-run]
    runs-on: ubuntu-latest
    steps:
      - run: jq --exit-status 'all(.result == "success")' <<< '${{ toJson(needs) }}'
